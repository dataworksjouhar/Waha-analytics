# Al Waha Destination Co. -- client configuration
# This is the file that makes the pipeline reusable. A future client (Al Bahar
# Perfumes, or anyone else) is a copy of this file with new values, plus new
# `mapping` implementations where their source files differ in shape. The
# pipeline code itself never changes per client.

client:
  name: "Al Waha Destination Co."
  short_name: waha
  currency: KWD
  timezone: Asia/Kuwait
  weekend: [FRI, SAT]        # Kuwait weekend, not Sat/Sun
  observes_ramadan: true     # generator shifts activity pattern when true

generator:
  seed: 42                   # fixed, so re-running produces identical data
  date_range:
    start: "2024-07-01"
    end: "2026-07-01"

# One entry per source system described in docs/phase0-architecture.md
# section 3. `mapping` names a transform function in pipeline/transform/
# that knows how to read that specific file shape into a conformed silver
# table. New source formats get a new mapping added to the shared library,
# never a client-specific fork of the pipeline.
sources:
  pos_sales:
    type: csv_drop            # one file lands per day
    pattern: "d365_salesline_*.csv"
    mapping: d365_fno
  footfall:
    type: csv_drop
    pattern: "footfall_*.csv"
    mapping: vendor_a
  tenant_sales:
    type: csv_folder          # many files, irregular arrival, per tenant per month
    pattern: "tenant_sales_*.csv"
    mapping: tenant_freeform
  web_sessions:
    type: csv_drop
    pattern: "web_sessions_*.csv"
    mapping: ga4_export
  web_bookings:
    type: csv_drop
    pattern: "web_bookings_*.csv"
    mapping: ga4_export
  events:
    type: csv_static          # one hand-maintained sheet, not a daily drop
    pattern: "events.csv"
    mapping: events_calendar
  weather:
    type: csv_drop
    pattern: "weather_*.csv"
    mapping: weather_daily
  contracts:
    type: csv_drop            # monthly export, memberships + boarding
    pattern: "contracts_*.csv"
    mapping: membership_contracts
  lessons:
    type: csv_drop
    pattern: "lessons_*.csv"
    mapping: lesson_schedule
  master_data:
    type: csv_seed            # static reference files, read from data/seeds/
    files:
      - tenants.csv
      - venues.csv
      - products.csv
      - gates.csv
      - stables.csv
      - instructors.csv
      - horses.csv

branding:
  primary_color: "#0F4C81"
  logo: waha.svg

# Jouhar's locked Phase 0 metric selection (architecture doc section 9).
# The gold layer must be able to answer every one of these via plain SQL.
metrics:
  enabled:
    - footfall_vs_ly_weather
    - footfall_to_sales_conversion
    - turnover_rent_owed_vs_collected
    - sales_per_sqm_by_category
    - online_vs_walkin_mix
    - website_conversion_by_channel
    - event_roi
    - membership_active_base_and_churn
    - revenue_summary_own_vs_rental
    - avg_transaction_value_by_venue
    - lesson_slot_utilization
    - stable_occupancy_and_boarding_revenue
